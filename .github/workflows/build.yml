name: Build Spatial OS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Install Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Check project files
        shell: bash
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Top-level files:"
          ls -la
          if [ ! -f settings.gradle.kts ] || [ ! -f build.gradle.kts ] || [ ! -f app/build.gradle.kts ]; then
            echo "::error::Android Gradle project files are missing from the repository root."
            echo "Expected settings.gradle.kts, build.gradle.kts, and app/build.gradle.kts."
            exit 1
          fi
          echo "Android project structure found."

      - name: 5. Install Gradle 8.9
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: 6. Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: 7. Show APK output
        if: always()
        shell: bash
        run: |
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -maxdepth 4 -type f -print
          else
            echo "No APK output directory was created. See the Build debug APK step above for the actual error."
          fi

      - name: 8. Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
