name: Build Spatial OS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Locate the Android project ZIP in the repo
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd
          ls -la

          ZIP_FILE=""
          for candidate in spatial-os-flat.zip spatial-os-android.zip; do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Android project ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: 4. Inspect the ZIP contents before extracting
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "$ZIP_FILE" | head -200 || {
            echo "::error::Unable to list files inside $ZIP_FILE"
            exit 1
          }

      - name: 5. Extract the Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/spatial-os-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/spatial-os-source"

          echo "Extracted files:"
          find "$RUNNER_TEMP/spatial-os-source" -maxdepth 3 -print | head -200

      - name: 6. Find the actual Gradle project directory
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$RUNNER_TEMP/spatial-os-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1 || true)"

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "::error::No Gradle project found inside the extracted ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root discovered at: $PROJECT_DIR"

      - name: 7. Install Android SDK
        uses: android-actions/setup-android@v4

      - name: 8. Accept licenses and install required SDK packages
        shell: bash
        run: |
          set -euo pipefail

          # Accept Android SDK licenses
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # Install the packages needed for building
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: 9. Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O "$RUNNER_TEMP/gradle-8.9-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: 10. Build the debug APK from the extracted source
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${PROJECT_DIR:-}"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::PROJECT_DIR is not set."
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "Current project directory:"
          pwd
          ls -la

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle or settings.gradle.kts was not found in project root."
            exit 1
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ] && [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::No Android app build.gradle file found."
            exit 1
          fi

          gradle --no-daemon --stacktrace assembleDebug

      - name: 11. Show APK output files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for built APK..."
          find "$PROJECT_DIR" -path "*/build/outputs/apk/*" -type f | head -200 || true

      - name: 12. Upload APK to GitHub Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-os-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
