plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spatialos.cardboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.spatialos.cardboard'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '3.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    androidResources {
        noCompress 'task', 'tflite'
    }
}

dependencies {
    // Native hand tracking (runs outside the WebView). Model file is downloaded by the build workflow.
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    // only used to report whether this phone can do AR world tracking
    implementation 'com.google.ar:core:1.40.0'
}
