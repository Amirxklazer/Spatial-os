<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Orbit OS</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; }
  #cam { position: fixed; left: 0; top: 0; width: 4px; height: 4px; opacity: 0.01; pointer-events: none; }
  #divider { position: fixed; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255,255,255,.9); pointer-events: none; }
  #gear { position: fixed; left: 50%; bottom: 10px; width: 36px; height: 36px; margin-left: -18px; pointer-events: none; opacity: .85; }
  #loader { position: fixed; inset: 0; z-index: 10; background: #000; transition: opacity .6s; }
  #loader.gone { opacity: 0; pointer-events: none; }
  #boot { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" autoplay muted playsinline></video>
<div id="divider"></div>
<svg id="gear" viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>

<div id="loader"><canvas id="boot"></canvas></div>

<script>
(function () {
  /* ---------------- 5 second boot animation (stereo: one image per eye, centred on the lenses) ---------------- */
  var BOOT_SECONDS = 5;
  var cv = document.getElementById('boot'), cx = cv.getContext('2d', { willReadFrequently: true });
  var bootStatus = 'Starting…', bootProg = 0, bootWarn = '', bootFail = '', ready = false, started = false, t0 = performance.now();
  function status(t, p) { bootStatus = t; if (p != null) bootProg = p; }
  function warn(t) { bootWarn = t; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej(new Error('Could not load ' + src)); }; document.body.appendChild(s); }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function ease(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function win(t, a, b, c, d) { return ease((t - a) / (b - a)) * (1 - ease((t - c) / (d - c))); }   // fade in a..b, hold, fade out c..d

  function lensSepPx() {
    var sep = 62, mm = 150;
    try { var s = JSON.parse(lsGet('sos.settings') || '{}'); if (s.lensSep) sep = s.lensSep; } catch (e) {}
    try { if (window.NativeBridge && NativeBridge.screenMM) mm = NativeBridge.screenMM() || 150; } catch (e) {}
    mm = clamp(mm, 90, 220); return clamp(sep / mm, 0.2, 0.9) * cv.width;
  }
  function resize() { var d = Math.min(window.devicePixelRatio || 1, 1.0); cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d); }  // low-res on purpose: smooth and cheap on any phone
  resize(); addEventListener('resize', resize);

  function text(c, s, x, y, size, alpha, weight, color, spacing) { if (alpha <= 0.01) return; c.save(); c.globalAlpha = alpha; c.fillStyle = color || '#fff'; c.font = (weight || 600) + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; try { c.letterSpacing = (spacing || 0) + 'px'; } catch (e) {} c.fillText(s, x, y); c.restore(); }

  // Orbit logo: glass sphere with a tilted ring that passes behind and in front of it, and a small satellite that circles it
  function orbitLogo(c, x, y, r, t, a) {
    if (a <= 0.01) return;
    var tilt = -0.38, rx = r * 1.02, ry = r * 0.34, sr = r * 0.56;
    function ringArc(from, to, lw, alpha) {
      c.save(); c.translate(x, y); c.rotate(tilt);
      var g = c.createLinearGradient(-rx, 0, rx, 0); g.addColorStop(0, 'rgba(94,231,255,' + alpha + ')'); g.addColorStop(0.5, 'rgba(79,123,255,' + alpha + ')'); g.addColorStop(1, 'rgba(155,107,255,' + alpha + ')');
      c.strokeStyle = g; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, from, to); c.stroke(); c.restore();
    }
    c.save(); c.globalAlpha = a;
    var gl = c.createRadialGradient(x, y, r * 0.2, x, y, r * 2.1); gl.addColorStop(0, 'rgba(100,140,255,.30)'); gl.addColorStop(1, 'rgba(100,140,255,0)'); c.fillStyle = gl; c.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
    ringArc(Math.PI, Math.PI * 2, r * 0.085, 0.55);                          // back half of the ring
    var sg = c.createRadialGradient(x - sr * 0.35, y - sr * 0.4, sr * 0.1, x, y, sr);
    sg.addColorStop(0, 'rgba(235,245,255,1)'); sg.addColorStop(0.28, 'rgba(130,175,255,1)'); sg.addColorStop(0.75, 'rgba(70,70,210,1)'); sg.addColorStop(1, 'rgba(36,30,120,1)');
    c.fillStyle = sg; c.beginPath(); c.arc(x, y, sr, 0, 7); c.fill();
    var hl = c.createRadialGradient(x - sr * 0.4, y - sr * 0.5, 0, x - sr * 0.4, y - sr * 0.5, sr * 0.5); hl.addColorStop(0, 'rgba(255,255,255,.75)'); hl.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = hl; c.beginPath(); c.arc(x, y, sr, 0, 7); c.fill();
    ringArc(0, Math.PI, r * 0.105, 1);                                        // front half of the ring
    var ang = t * 1.6, sx = Math.cos(ang) * rx, sy = Math.sin(ang) * ry, ca = Math.cos(tilt), sn = Math.sin(tilt);
    var px = x + sx * ca - sy * sn, py = y + sx * sn + sy * ca;                // satellite
    if (Math.sin(ang) > 0 || Math.hypot(px - x, py - y) > sr * 1.05) { c.shadowColor = 'rgba(160,220,255,.95)'; c.shadowBlur = r * 0.3; c.fillStyle = '#fff'; c.beginPath(); c.arc(px, py, r * 0.075, 0, 7); c.fill(); }
    c.restore();
  }
  window.OrbitLogo = orbitLogo;
  // wordmark whose letters are revealed by a travelling band of light
  function wordmark(c, ex, ey, u, t) {
    var a = ease((t - 1.2) / 1.2) * (1 - ease((t - 100) / 1)); if (a <= 0.01) return;
    var size = u * 84, str = 'ORBIT OS', sp = u * 18;
    c.save(); c.font = '300 ' + size + 'px system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif'; try { c.letterSpacing = sp + 'px'; } catch (e) {}
    var w = c.measureText(str).width, x0 = ex - w / 2 + sp / 2, sweep = ((t - 1.6) * 0.5) % 1.6 - 0.3;
    c.textAlign = 'left'; c.textBaseline = 'middle'; c.globalAlpha = a;
    var g = c.createLinearGradient(x0, 0, x0 + w, 0);
    var s0 = clamp(sweep, 0, 1);
    g.addColorStop(0, 'rgba(255,255,255,.7)'); g.addColorStop(clamp(s0 - 0.14, 0, 1), 'rgba(255,255,255,.7)'); g.addColorStop(s0, 'rgba(190,225,255,1)'); g.addColorStop(clamp(s0 + 0.14, 0, 1), 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,.7)');
    c.shadowColor = 'rgba(110,150,255,.55)'; c.shadowBlur = u * 22;
    c.fillStyle = g; c.fillText(str, x0, ey); c.restore();
    text(c, 'a floating world for your phone', ex, ey + u * 66, u * 24, 0.55 * a * ease((t - 2.2) / 1.2), 400, '#fff', u * 3);
  }
  function drawEye(c, ex, ey, u, t) {
    var pop = 0.82 + 0.18 * ease(t / 1.3);
    orbitLogo(c, ex, ey - u * 80, u * 118 * pop, t, ease(t / 0.9));
    wordmark(c, ex, ey + u * 84, u, t);
    // progress line
    var pa = ease((t - 0.6) / 0.8); if (pa > 0.01) { var lw = u * 260, ly = ey + u * 206; c.save(); c.globalAlpha = 0.55 * pa; c.fillStyle = 'rgba(255,255,255,.16)'; c.fillRect(ex - lw / 2, ly, lw, Math.max(2, u * 4)); var gg = c.createLinearGradient(ex - lw / 2, 0, ex + lw / 2, 0); gg.addColorStop(0, '#5ee7ff'); gg.addColorStop(1, '#9b6bff'); c.fillStyle = gg; c.fillRect(ex - lw / 2, ly, lw * Math.max(0.04, Math.min(1, bootProg, t / BOOT_SECONDS)), Math.max(2, u * 4)); c.restore(); }
    if (bootWarn) text(c, bootWarn, ex, ey + u * 256, u * 21, 0.95 * win(t, 1.5, 2.2, 99, 100), 500, '#ffd60a');
  }
  function frame() {
    var t = (performance.now() - t0) / 1000, c = cv.getContext('2d'), W = cv.width, H = cv.height;
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
    var sep = lensSepPx(), u = Math.min(W / 2, H) / 760, ey = H / 2 - u * 20;
    if (bootFail) { var m = bootFail; [W / 2 - sep / 2, W / 2 + sep / 2].forEach(function (x) { text(c, 'Something went wrong', x, ey - u * 40, u * 44, 1, 700); text(c, String(m).slice(0, 60), x, ey + u * 20, u * 26, 0.8, 500, '#ffd60a'); text(c, 'Tap the screen to try again', x, ey + u * 80, u * 26, 0.7, 500); }); requestAnimationFrame(frame); return; }
    var fade = 1;
    c.globalAlpha = fade; drawEye(c, W / 2 - sep / 2, ey, u, t); drawEye(c, W / 2 + sep / 2, ey, u, t); c.globalAlpha = 1;
    if (t >= BOOT_SECONDS) {
      if (ready && !started) { begin(); return; }
      if (!ready) { [W / 2 - sep / 2, W / 2 + sep / 2].forEach(function (x) { text(c, bootStatus || 'Almost there…', x, ey + u * 256, u * 26, 0.8, 500); }); }
    }
    requestAnimationFrame(frame);
  }
  var SOSref = null;
  function begin() {
    if (started) return; started = true;
    try { SOSref.audio(); SOSref.start(); } catch (e) { console.error(e); }
    var L = document.getElementById('loader'); L.classList.add('gone'); setTimeout(function () { L.style.display = 'none'; }, 700);
    setTimeout(function () { lsSet('sos.run', 'ok'); }, 6000);
  }
  document.getElementById('loader').addEventListener('touchend', function (e) { if (bootFail) { e.preventDefault(); location.reload(); } }, { passive: false });
  document.getElementById('loader').addEventListener('click', function () { if (bootFail) location.reload(); });
  requestAnimationFrame(frame);

  // crash detection: 'boot' is cleared once the app has been running fine for a few seconds
  var crashed = lsGet('sos.run') === 'boot', handsCrashed = lsGet('sos.handsrun') === '1';
  lsSet('sos.run', 'boot');
  function markOk() { lsSet('sos.run', 'ok'); }
  window.addEventListener('pagehide', markOk);
  document.addEventListener('visibilitychange', function () { if (document.hidden) markOk(); });
  window.addEventListener('error', function (ev) { if (!started) bootFail = ev.message || 'Error'; });

  (async function () {
    try {
      status('Loading 3D engine…', 0.08); await sleep(60);
      await loadScript('three.min.js');
      status('Loading interface…', 0.25); await sleep(40);
      await loadScript('core.js'); await loadScript('apps.js'); await loadScript('apps2.js'); await loadScript('apps3.js'); await loadScript('apps4.js'); await loadScript('spiral.js'); await loadScript('handtrack.js');
      var SOS = window.SOS, S = SOS.settings; SOSref = SOS;
      if (crashed || handsCrashed) {
        S.camera = false; if (crashed) S.resScale = Math.min(S.resScale, 0.6);
        if (handsCrashed) { S.hands = false; lsSet('sos.handsrun', '0'); }
        SOS.save();
        warn(handsCrashed ? 'Hand tracking crashed the app last time, so it is off.' : 'The app closed unexpectedly last time, so the camera is off.');
      }
      status('Preparing your space…', 0.5); await sleep(80);
      SOS.prepare();
      if (S.camera) {
        status('Starting camera…', 0.68);
        await Promise.race([SOS.enableCamera(), sleep(15000)]);
        if (S.hands && SOS.camState === 'on') { status('Loading hand tracking…', 0.82); await sleep(250); await Promise.race([SOS.startHands(), sleep(25000)]); }
      }
      status('Ready', 1); ready = true;
    } catch (e) { bootFail = String(e && e.message || e); }
  })();
})();
</script>
</body>
</html>
